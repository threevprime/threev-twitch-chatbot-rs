[package]
name = "threev_twitch_chatbot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"]}
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
log = "0.4.35"
mime_guess = "2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
zip = "4"
